<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breath · 会呼吸的导航页</title>
<style>
:root{--ease:cubic-bezier(.22,.9,.3,1);--glass-bg:rgba(255,255,255,.07);--glass-line:rgba(255,255,255,.15)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eef2fa;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:background 2.5s ease}
body.sky-night{background:linear-gradient(180deg,#050914 0%,#0b1226 55%,#141c38 100%)}
body.sky-late{background:linear-gradient(180deg,#04060f 0%,#080d1d 60%,#0e1530 100%)}
body.sky-dawn{background:linear-gradient(180deg,#1a2340 0%,#3d3a5e 45%,#8a5d6e 80%,#c98a6b 100%)}
body.sky-day{background:linear-gradient(180deg,#5b8fc9 0%,#7fb2d9 45%,#a8cfe0 100%);color:#12203a}
body.sky-dusk{background:linear-gradient(180deg,#241d3e 0%,#4a3060 30%,#5c3a5e 55%,#96575a 80%,#c98a6b 100%)}
body.cloudy{filter:saturate(.62) brightness(.92)}
body.rainy{filter:saturate(.58) brightness(.84)}
#wind{position:fixed;inset:0;pointer-events:none}
.halo{position:fixed;border-radius:50%;pointer-events:none;filter:blur(56px);opacity:.2;
  will-change:transform;transition:opacity 2s}
.halo.h1{width:46vw;height:46vw;left:-12vw;top:-16vw;background:radial-gradient(circle,#7aa2ff,transparent 60%)}
.halo.h2{width:38vw;height:38vw;right:-10vw;bottom:-14vw;background:radial-gradient(circle,#6ee7d8,transparent 60%)}
.glass{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 34px rgba(0,0,0,.16)}
.clock{font-size:clamp(64px,13vw,124px);font-weight:200;letter-spacing:.04em;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 4px 40px rgba(0,0,0,.25)}
body.sky-day .clock{text-shadow:0 4px 30px rgba(255,255,255,.35)}
.dateline{font-size:14.5px;opacity:.82;letter-spacing:.14em}
.greet{font-size:16px;margin-top:6px;opacity:.92}
.search{margin-top:34px;width:min(600px,88vw);display:flex;align-items:center;gap:6px;border-radius:100px;
  padding:6px 6px 6px 22px;transition:.35s var(--ease)}
.search:focus-within{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 48px rgba(0,0,0,.24)}
.search input{flex:1;background:none;border:none;outline:none;color:inherit;font-size:15.5px;font-family:inherit}
.search input::placeholder{color:currentColor;opacity:.5}
.search button{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#6ee7d8,#7aa2ff 55%,#c9a7ff);color:#08101f;font-size:16px;transition:.3s}
.search button:hover{filter:brightness(1.12);transform:scale(1.06)}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.chip{font-size:12px;padding:6px 15px;border-radius:100px;color:inherit;opacity:.78;cursor:pointer;
  background:var(--glass-bg);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:.3s var(--ease);font-family:inherit}
.chip:hover{opacity:1;transform:translateY(-2px)}
.chip.on{opacity:1;border-color:#6ee7d8;color:#6ee7d8}
body.sky-day .chip.on{color:#0b6e63;border-color:#0b6e63}
.dock{display:flex;gap:6px;margin-top:26px;padding:7px;border-radius:100px;flex-wrap:wrap;justify-content:center}
.dock a{font-size:13px;color:inherit;opacity:.75;text-decoration:none;padding:9px 20px;border-radius:100px;transition:.3s var(--ease)}
.dock a:hover{opacity:1;background:rgba(255,255,255,.1);transform:translateY(-3px)}
.dock a.frenemy{border:1px dashed rgba(255,255,255,.3);transform:rotate(-1.6deg)}
.dock a.frenemy:hover{transform:translateY(-3px) rotate(1.6deg);border-color:#c9a7ff;background:rgba(201,167,255,.08)}
.wx{position:fixed;top:22px;right:26px;font-size:12.5px;opacity:.75;padding:8px 16px;border-radius:100px}
.credit{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11.5px;opacity:.5}
.credit a{color:inherit}
@media(max-width:560px){.clock{font-size:20vw}.wx{top:14px;right:16px;font-size:11.5px}.search{margin-top:24px}}
</style>
</head>
<body class="sky-night">
<canvas id="wind"></canvas>
<div class="halo h1" id="halo1"></div><div class="halo h2" id="halo2"></div>

<div class="wx glass" id="wx">正在感知天气…</div>
<div class="clock" id="clock">--:--</div>
<div class="dateline" id="dateline"></div>
<div class="greet" id="greet"></div>

<form class="search glass" id="sForm">
  <input id="sInput" type="text" placeholder="搜点什么，风会带路…（Enter）" autocomplete="off">
  <button type="submit" title="搜索">➤</button>
</form>
<div class="chips" id="engines">
  <button class="chip on" data-eng="bing">必应</button>
  <button class="chip" data-eng="baidu">百度</button>
  <button class="chip" data-eng="google">Google</button>
</div>
<div class="chips" id="wxMan">
  <button class="chip on" data-wx="auto">自动</button>
  <button class="chip" data-wx="clear">☀️ 晴</button>
  <button class="chip" data-wx="cloud">⛅ 云</button>
  <button class="chip" data-wx="rain">🌧️ 雨</button>
  <button class="chip" data-wx="snow">❄️ 雪</button>
</div>
<div class="dock glass">
  <a href="/">🍃 博客</a>
  <a href="/admin.html">📊 后台</a>
  <a href="/tools/wuwa-gacha.html">🎯 抽卡分析</a>
  <a class="frenemy" id="doveLink" href="https://dove.best" target="_blank" rel="noopener noreferrer"></a>
</div>
<div class="credit">会呼吸的导航页 · 来自 <a href="/">Breeze</a> · 浏览器设置里把启动页/主页设为本链接即可每日使用</div>

<script>
(function(){
"use strict";
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
var clamp = function(v,a,b){return Math.max(a,Math.min(b,v))};

/* ============ 时钟 / 问候 / 天空 ============ */
var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function skyOf(h){
  if(h >= 5 && h < 8) return "dawn";
  if(h >= 8 && h < 16) return "day";
  if(h >= 16 && h < 19) return "dusk";
  if(h >= 19 && h < 23) return "night";
  return "late";
}
function greetOf(h){
  if(h < 5) return "凌晨好，星星替你值班 🌙";
  if(h < 9) return "早上好，今天有风 ☀️";
  if(h < 12) return "上午好，适合写点什么";
  if(h < 14) return "中午好，记得吃饭 🍚";
  if(h < 18) return "下午好，来杯咖啡 ☕";
  if(h < 23) return "晚上好，夜色正好 🌆";
  return "夜深了，风也困了";
}
var curSky = "";
var WX_MODE = "auto", WX_REAL = "clear"; /* 必须先于 tick() 初始化 */
function tick(){
  var d = new Date(), p = function(n){return String(n).padStart(2,"0")};
  document.getElementById("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes());
  document.getElementById("dateline").textContent = (d.getMonth()+1) + " 月 " + d.getDate() + " 日 · " + WEEK[d.getDay()];
  document.getElementById("greet").textContent = greetOf(d.getHours());
  var sky = skyOf(d.getHours());
  if(sky !== curSky){ curSky = sky; applySky(); rebuild(); }
}
function applySky(){
  var mode = effMode();
  var cls = "sky-" + curSky;
  if(mode === "rain") cls += " rainy";
  else if(mode === "cloud") cls += " cloudy";
  document.body.className = cls;
}
tick(); setInterval(tick, 1000);

/* ============ 天气 ============ */
try{ var savedWx = localStorage.getItem("breath-wx"); if(savedWx){ WX_MODE = savedWx; syncChips("#wxMan", savedWx); } }catch(e){}
function effMode(){ return WX_MODE === "auto" ? WX_REAL : WX_MODE; }
function codeToMode(c){
  if(c === 0 || c === 1) return "clear";
  if(c === 2 || c === 3 || c === 45 || c === 48) return "cloud";
  if((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || (c >= 95 && c <= 99)) return "rain";
  if((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
  return "cloud";
}
var WX_NAME = {clear:"晴", cloud:"多云", rain:"雨", snow:"雪"};
var WX_ICON = {clear:"☀️", cloud:"⛅", rain:"🌧️", snow:"❄️"};
function tryGeo(){
  if(!navigator.geolocation){ document.getElementById("wx").textContent = "🌤️ 天气未知 · 点下方按钮切换"; return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + pos.coords.latitude.toFixed(2) +
              "&longitude=" + pos.coords.longitude.toFixed(2) + "&current_weather=true";
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      var cw = j.current_weather;
      if(!cw) throw 0;
      WX_REAL = codeToMode(cw.weathercode);
      var hot = cw.temperature != null ? " · " + Math.round(cw.temperature) + "°C" : "";
      var tag = WX_MODE === "auto" ? "" : "（手动：" + WX_NAME[effMode()] + "）";
      document.getElementById("wx").textContent = WX_ICON[WX_REAL] + " " + WX_NAME[WX_REAL] + hot + tag;
      applySky(); rebuild();
    }).catch(function(){ document.getElementById("wx").textContent = "🌤️ 天气服务没连上 · 可手动切换"; });
  }, function(){ document.getElementById("wx").textContent = "🌤️ 未授权定位 · 可手动切换天气"; }, {timeout: 8000});
}
function syncChips(sel, val){
  document.querySelectorAll(sel + " .chip").forEach(function(c){
    c.classList.toggle("on", c.getAttribute("data-" + (sel === "#wxMan" ? "wx" : "eng")) === val);
  });
}
document.querySelectorAll("#wxMan .chip").forEach(function(c){
  c.addEventListener("click", function(){
    WX_MODE = c.getAttribute("data-wx");
    try{ localStorage.setItem("breath-wx", WX_MODE); }catch(e){}
    syncChips("#wxMan", WX_MODE);
    if(WX_MODE === "auto"){
      document.getElementById("wx").textContent = "🔄 自动感知中…";
      tryGeo();
    } else {
      document.getElementById("wx").textContent = WX_ICON[WX_MODE] + " " + WX_NAME[WX_MODE] + "（手动）";
    }
    applySky(); rebuild();
  });
});
tryGeo();

/* ============ 搜索 ============ */
var ENG = "bing";
try{ var se = localStorage.getItem("breath-eng"); if(se){ ENG = se; syncChips("#engines", se); } }catch(e){}
var ENG_URL = {bing:"https://www.bing.com/search?q=", baidu:"https://www.baidu.com/s?wd=", google:"https://www.google.com/search?q="};
document.querySelectorAll("#engines .chip").forEach(function(c){
  c.addEventListener("click", function(){
    ENG = c.getAttribute("data-eng");
    try{ localStorage.setItem("breath-eng", ENG); }catch(e){}
    syncChips("#engines", ENG);
  });
});
document.getElementById("sForm").addEventListener("submit", function(e){
  e.preventDefault();
  var q = document.getElementById("sInput").value.trim();
  if(q) location.href = ENG_URL[ENG] + encodeURIComponent(q);
});

/* ============ 死党链接（随机整活 + 会跑路） ============ */
var DOVE_LABELS = [
  "🕊️ 友尽链接","🕊️ 隔壁鸽子窝","🕊️ 鸽子精收容所","🕊️ 咕咕咕 · 电台","🕊️ 今日赶超目标",
  "🕊️ 假想敌总部","🕊️ 查看敌方动态","🕊️ 死党老巢 · 侵入提醒","🕊️ 对面那位 · 蹲一个更新","🕊️ 慎入 · 有鸽子味"
];
var DOVE_TIPS = [
  "点进去给他个浏览量，回来我们继续卷","友情提示：他的风没有我们的大","本链接不消耗友情值，放心点",
  "据说他也在做导航页……有点慌","嘘——我们正在偷偷超越他","每日一比 · 今日胜负未出","咕咕咕是鸽子发来的求和信号"
];
var DOVE_TAUNT = [
  "翅膀一抖，没抓到 🕊️","又跑了，再试试？","风在保护我，你再抓抓看","快了快了，就差一点","这次我认真的……才怪","你的手速不行啊，朋友"
];
var doveEarned = false, doveTries = 0;
var doveNeed = 3 + Math.floor(Math.random() * 2);
(function(){
  var a = document.getElementById("doveLink");
  a.textContent = DOVE_LABELS[Math.floor(Math.random() * DOVE_LABELS.length)];
  a.title = DOVE_TIPS[Math.floor(Math.random() * DOVE_TIPS.length)];
  function dodge(){
    if(doveEarned) return;
    doveTries++;
    var dx = Math.random() * 240 - 120, dy = Math.random() * 110 - 55;
    a.style.transition = "transform .2s cubic-bezier(.3,1.4,.5,1)";
    a.style.transform = "translate(" + dx.toFixed(0) + "px," + dy.toFixed(0) + "px) rotate(" + (Math.random() * 10 - 5).toFixed(1) + "deg)";
    if(doveTries >= doveNeed){
      doveEarned = true;
      setTimeout(function(){
        a.style.transition = "transform .45s cubic-bezier(.22,.9,.3,1)";
        a.style.transform = "";
        a.title = "行吧行吧，这次放行 🕊️ 快点我";
      }, 380);
    } else {
      a.title = DOVE_TAUNT[Math.min(doveTries - 1, DOVE_TAUNT.length - 1)];
    }
  }
  a.addEventListener("pointerenter", dodge);
  a.addEventListener("click", function(e){
    if(!doveEarned){ e.preventDefault(); dodge(); return; }
    a.textContent = "🕊️ ……算你厉害，放行";
  });
})();

/* ============================================================
   呼吸粒子引擎 v3 —— 场景（极光/篝火/绿植） + 分层视差
   ============================================================ */
var cv = document.getElementById("wind"), x = cv.getContext("2d");
var W, H, parts = [], effects = [];
var raf = null, lastT = 0;
var mouse = {x:0, y:0, tx:0, ty:0};
addEventListener("pointermove", function(e){
  mouse.tx = e.clientX / innerWidth - .5;
  mouse.ty = e.clientY / innerHeight - .5;
}, {passive:true});

function makeGlow(color, size){
  var s = document.createElement("canvas");
  s.width = s.height = size * 2;
  var sc = s.getContext("2d");
  var g = sc.createRadialGradient(size, size, 0, size, size, size);
  g.addColorStop(0, "rgba(" + color + ",.55)");
  g.addColorStop(.4, "rgba(" + color + ",.18)");
  g.addColorStop(1, "rgba(" + color + ",0)");
  sc.fillStyle = g; sc.fillRect(0, 0, size * 2, size * 2);
  return s;
}
var SPRITES = {};
function initSprites(){
  SPRITES = {
    blue: makeGlow("122,162,255", 64), teal: makeGlow("110,231,216", 64),
    violet: makeGlow("201,167,255", 64), warm: makeGlow("255,205,150", 64),
    white: makeGlow("255,255,255", 64), cloud: makeGlow("235,242,252", 64),
    aur1: makeGlow("96,235,185", 64), aur2: makeGlow("150,120,255", 64), aur3: makeGlow("90,200,255", 64),
    flame: makeGlow("255,140,50", 64), fire: makeGlow("255,205,95", 64)
  };
}
initSprites();

function rs(){ W = cv.width = innerWidth; H = cv.height = innerHeight; rebuild(); }

/* 场景开关：极光 / 篝火 / 绿植 */
var SCN = {aurora:false, fire:false, plant:false};
function updateScene(){
  var mode = effMode(), sky = curSky || "night";
  var nightish = sky === "night" || sky === "late" || sky === "dusk";
  SCN.aurora = nightish && mode !== "rain";
  SCN.fire = nightish && mode !== "rain";
  SCN.plant = sky === "day" || sky === "dawn" || sky === "dusk" || mode === "rain" || mode === "snow";
}

function rebuild(){
  if(!W || !H) return; /* rs() 尺寸就绪后再真正构建 */
  parts = []; effects = [];
  updateScene();
  var mode = effMode(), sky = curSky || "night";
  var i;
  if(mode === "clear"){
    var nb = sky === "day" ? 16 : 12;
    for(i = 0; i < nb; i++) parts.push({t:"bokeh", x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*70+40, vx:(Math.random()-.5)*.26, vy:-Math.random()*.16-.03,
      a:Math.random()*.5+.4, ph:Math.random()*7, d:Math.random()*.9+.1,
      spr: (sky === "dawn" || sky === "dusk") ? "warm" : (Math.random() < .5 ? "blue" : "teal")});
    for(i = 0; i < 8; i++) parts.push({t:"sparkle", x:Math.random()*W, y:Math.random()*H,
      life:Math.random()*6, max:Math.random()*5+3, r:Math.random()*3+2.6, d:Math.random()});
    if(sky === "night" || sky === "late"){
      for(i = 0; i < (sky === "late" ? 170 : 130); i++) parts.push({t:"star", x:Math.random()*W, y:Math.random()*H*.85,
        r:Math.random()*1.5+.4, ph:Math.random()*7, sp:Math.random()*.9+.4, a:Math.random()*.6+.3, d:Math.random()});
    } else if(sky === "dawn" || sky === "dusk"){
      for(i = 0; i < 8; i++) parts.push({t:"fly", x:Math.random()*W, y:H*.45+Math.random()*H*.45,
        ph:Math.random()*7, sp:Math.random()*.7+.5, d:Math.random()});
    }
  } else if(mode === "cloud"){
    for(i = 0; i < 8; i++) parts.push({t:"puff", x:Math.random()*(W+500)-250, y:Math.random()*H*.75+H*.04,
      s:Math.random()*1.6+.7, v:Math.random()*.32+.1, d:Math.random()*.9+.1, ph:Math.random()*7});
    if(sky === "night" || sky === "late")
      for(i = 0; i < 70; i++) parts.push({t:"star", x:Math.random()*W, y:Math.random()*H*.6,
        r:Math.random()*1.3+.4, ph:Math.random()*7, sp:Math.random()*.8+.4, a:Math.random()*.45+.25, d:Math.random()});
  } else if(mode === "rain"){
    for(i = 0; i < (reduced?80:180); i++) parts.push({t:"drop", x:Math.random()*W, y:Math.random()*H,
      l:Math.random()*18+9, v:Math.random()*5.5+6.5, a:Math.random()*.3+.2, d:Math.random()});
    for(i = 0; i < 4; i++) parts.push({t:"puff", x:Math.random()*(W+500)-250, y:Math.random()*H*.4,
      s:Math.random()*1.4+.8, v:Math.random()*.2+.06, d:Math.random()*.6+.1, ph:Math.random()*7, dark:true});
  } else if(mode === "snow"){
    for(i = 0; i < 140; i++) parts.push({t:"flake", x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*2.6+1, v:Math.random()*.8+.35, ph:Math.random()*7, a:Math.random()*.5+.3, d:Math.random()});
  } else {
    for(i = 0; i < 40; i++) parts.push({t:"star", x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.1+.3, ph:Math.random()*7, sp:.5, a:.35, d:Math.random()});
  }
  /* 篝火火星 */
  if(SCN.fire){
    var fx = W * .82, fy = H - 64;
    for(i = 0; i < 11; i++) parts.push({t:"ember", ph:Math.random()*7, life:Math.random()*3,
      sp:Math.random()*.7+.6, a:Math.random()*.5+.4, d:.5 + Math.random()*.5});
  }
}

function spawnMeteor(){
  effects.push({t:"meteor", x:Math.random()*W*.7 + W*.15, y:Math.random()*H*.25,
    vx:(Math.random()*4+5) * (Math.random()<.5?-1:1), vy:Math.random()*2.4+2.4, life:1});
}
function spawnSplash(px, py){
  effects.push({t:"splash", x:px, y:py, r:0, a:.45});
  if(Math.random() < .6) effects.push({t:"splash", x:px + Math.random()*14-7, y:py, r:0, a:.35});
}

var meteorCd = 4;
function firePos(){ return {x: W * .82, y: H - 64}; }

/* ---- 极光（低存在感垂帘，lighter 叠加） ---- */
function drawAurora(now){
  x.globalCompositeOperation = "lighter";
  var sprs = [SPRITES.aur1, SPRITES.aur2, SPRITES.aur3];
  for(var k = 0; k < 3; k++){
    var spr = sprs[k];
    for(var i = 0; i < 9; i++){
      var wx = (W / 8) * i - W * .05 + mouse.x * 18;
      var y = H * .15 + Math.sin(now*.00042 + i*.5 + k*2.1) * 30 + Math.sin(now*.0011 + i*1.31) * 14;
      var s = 130 + Math.sin(now*.0007 + i*.8 + k) * 36;
      x.globalAlpha = .07 + .05 * Math.sin(now*.0006 + i*.7 + k*1.4) + .05;
      x.drawImage(spr, wx - s, y - s*1.5, s*2, s*2.8);
    }
  }
  x.globalCompositeOperation = "source-over";
  x.globalAlpha = 1;
}

/* ---- 篝火（极简：三层火苗 + 柴 + 石头 + 地面光） ---- */
function drawCampfire(now){
  var fp = firePos(), fx = fp.x, fy = fp.y;
  var fl = 1 + Math.sin(now*.012)*.12 + Math.sin(now*.031)*.06;
  var par = mouse.x * 10;
  fx += par; fy += mouse.y * 7;
  x.globalAlpha = .55;
  x.drawImage(SPRITES.flame, fx - 90*fl, fy - 45*fl, 180*fl, 90*fl);
  x.globalAlpha = .85;
  x.drawImage(SPRITES.flame, fx - 30*fl, fy - 76*fl, 60*fl, 104*fl);
  x.globalAlpha = .95;
  x.drawImage(SPRITES.fire, fx - 16*fl, fy - 50*fl, 32*fl, 66*fl);
  x.globalAlpha = .9;
  x.drawImage(SPRITES.white, fx - 7, fy - 24*fl, 14, 30*fl);
  x.globalAlpha = .85;
  x.strokeStyle = "rgba(32,24,18,.85)"; x.lineWidth = 7; x.lineCap = "round";
  x.beginPath(); x.moveTo(fx - 26, fy + 7); x.lineTo(fx + 22, fy - 3);
  x.moveTo(fx - 22, fy - 3); x.lineTo(fx + 26, fy + 7); x.stroke();
  x.fillStyle = "rgba(30,26,22,.55)";
  [[-46,9,9],[46,11,8],[-35,13,6],[37,15,6]].forEach(function(s){
    x.beginPath(); x.ellipse(fx + s[0], fy + s[1], s[2], s[2]*.7, 0, 0, 6.2832); x.fill();
  });
  x.globalAlpha = 1;
}

/* ---- 窗台绿植（极简线稿，叶子轻摆） ---- */
function drawPlant(now){
  var bx = Math.max(96, W * .13), by = H - 30;
  var sway = Math.sin(now*.0009) * 3, sway2 = Math.sin(now*.0011 + 1.2) * 4;
  bx += mouse.x * 12; by += mouse.y * 8;
  x.globalAlpha = .75;
  x.strokeStyle = "rgba(70,90,80,.4)"; x.lineWidth = 2; x.lineCap = "round";
  x.beginPath(); x.moveTo(bx - 92, by); x.lineTo(bx + 92, by); x.stroke();
  x.fillStyle = "rgba(74,62,52,.5)";
  x.beginPath(); x.moveTo(bx - 19, by); x.lineTo(bx + 19, by); x.lineTo(bx + 13, by + 20); x.lineTo(bx - 13, by + 20); x.closePath(); x.fill();
  x.strokeStyle = "rgba(52,128,92,.6)"; x.lineWidth = 3;
  var leaves = [[-14,-44,-20,-52],[ -6,-52,-14,-64],[0,-48,6,-62],[8,-42,20,-50],[14,-36,24,-40]];
  leaves.forEach(function(L, i){
    var s = i % 2 === 0 ? sway : sway2;
    x.beginPath();
    x.moveTo(bx, by);
    x.quadraticCurveTo(bx + L[0]*.5 + s, by + L[1]*.6, bx + L[2] + s, by + L[3]);
    x.stroke();
    x.beginPath(); x.arc(bx + L[2] + s, by + L[3], 2.4, 0, 6.2832);
    x.fillStyle = "rgba(52,128,92,.55)"; x.fill();
  });
  x.globalAlpha = 1;
}

var meteorCd = 4;
function frame(now){
  if(!lastT) lastT = now;
  var dt = clamp((now - lastT) / 16.666, 0, 3); lastT = now;
  mouse.x += (mouse.tx - mouse.x) * .06 * dt;
  mouse.y += (mouse.ty - mouse.y) * .06 * dt;
  var h1 = document.getElementById("halo1"), h2 = document.getElementById("halo2");
  if(h1) h1.style.transform = "translate3d(" + (mouse.x * -30).toFixed(1) + "px," + (mouse.y * -20).toFixed(1) + "px,0)";
  if(h2) h2.style.transform = "translate3d(" + (mouse.x * -46).toFixed(1) + "px," + (mouse.y * -30).toFixed(1) + "px,0)";

  x.clearRect(0, 0, W, H);
  var mode = effMode(), sky = curSky || "night";
  var i, p;

  if(SCN.aurora) drawAurora(now);

  for(i = 0; i < parts.length; i++){
    p = parts[i];
    var px = p.x + mouse.x * 46 * (p.d || .4);
    var py = p.y + mouse.y * 30 * (p.d || .4);
    if(p.t === "bokeh"){
      p.x += p.vx * dt; p.y += p.vy * dt;
      if(p.y < -p.r){ p.y = H + p.r; p.x = Math.random()*W; }
      if(p.x < -p.r) p.x = W + p.r; else if(p.x > W + p.r) p.x = -p.r;
      var twb = .65 + Math.sin(now*.0009 + p.ph)*.35;
      x.globalAlpha = clamp(p.a * twb * 1.35, 0, 1);
      x.drawImage(SPRITES[p.spr], px - p.r, py - p.r, p.r*2, p.r*2);
    } else if(p.t === "sparkle"){
      p.life += dt / 50;
      if(p.life > p.max){ p.life = 0; p.x = Math.random()*W; p.y = Math.random()*H; p.max = Math.random()*5+3; }
      var k = Math.sin(Math.PI * clamp(p.life / p.max, 0, 1));
      var r = p.r * k;
      x.globalAlpha = 1;
      x.strokeStyle = "rgba(255,255,255,.95)"; x.lineWidth = 1.2;
      x.beginPath();
      x.moveTo(px - r*2.2, py); x.lineTo(px + r*2.2, py);
      x.moveTo(px, py - r*2.2); x.lineTo(px, py + r*2.2);
      x.stroke();
      x.beginPath(); x.arc(px, py, r*.55, 0, 6.2832);
      x.fillStyle = "rgba(255,255,255," + (k*.95) + ")"; x.fill();
    } else if(p.t === "star"){
      var a = p.a * (.55 + Math.sin(now*.001*p.sp + p.ph)*.45);
      x.globalAlpha = 1;
      x.beginPath(); x.arc(px, py, p.r, 0, 6.2832);
      x.fillStyle = "rgba(225,236,255," + a + ")"; x.fill();
      if(p.r > 1.2){
        x.beginPath(); x.arc(px, py, p.r*3.6, 0, 6.2832);
        x.fillStyle = "rgba(160,190,255," + a*.13 + ")"; x.fill();
      }
    } else if(p.t === "fly"){
      p.x += Math.sin(now*.0006*p.sp + p.ph)*.55*dt;
      p.y += Math.cos(now*.0005*p.sp + p.ph*1.7)*.36*dt;
      var fa = clamp(.5 + Math.sin(now*.002*p.sp + p.ph)*.45, .05, 1);
      x.globalAlpha = fa;
      x.drawImage(SPRITES.warm, px-11, py-11, 22, 22);
    } else if(p.t === "puff"){
      p.x += p.v * dt;
      if(p.x > W + 260) p.x = -260;
      var bob = Math.sin(now*.0004 + p.ph)*8;
      x.globalAlpha = p.dark ? .12 : .18;
      var spr = SPRITES.cloud, sw = 190*p.s, sh = 120*p.s;
      x.drawImage(spr, px-sw/2, py+bob-sh/2, sw, sh);
      x.drawImage(spr, px-sw*.32, py+bob+6-sh*.42, sw*.72, sh*.72);
      x.drawImage(spr, px+sw*.26, py+bob+2-sh*.38, sw*.6, sh*.6);
    } else if(p.t === "drop"){
      p.y += p.v * dt; p.x -= p.v * .16 * dt;
      if(p.y > H - 4){
        if(Math.random() < .5) spawnSplash(px, H - Math.random()*H*.16);
        p.y = -p.l; p.x = Math.random()*W;
      }
      x.globalAlpha = 1;
      x.beginPath(); x.moveTo(px, py); x.lineTo(px + p.l*.16, py - p.l);
      x.strokeStyle = "rgba(190,218,255," + p.a + ")"; x.lineWidth = p.d > .6 ? 1.8 : 1.2; x.stroke();
    } else if(p.t === "flake"){
      p.y += p.v * dt; p.x += Math.sin(now*.0008 + p.ph)*.55*dt;
      if(p.y > H + 4){ p.y = -4; p.x = Math.random()*W; }
      x.globalAlpha = 1;
      x.beginPath(); x.arc(px, py, p.r, 0, 6.2832);
      x.fillStyle = "rgba(255,255,255," + p.a + ")"; x.fill();
    } else if(p.t === "ember"){
      var fp = firePos();
      p.life += dt / 60;
      var cyc = p.life % 3;
      var ey = fp.y - 40 - cyc * 68 * p.sp;
      var ex = fp.x + Math.sin(now*.002 + p.ph)*16*(cyc*.5+.4) + mouse.x*12;
      var ea = p.a * (1 - cyc/3);
      if(ea > .02){
        x.globalAlpha = ea;
        x.drawImage(SPRITES.fire, ex-4.5, ey-4.5, 9, 9);
      }
    }
  }

  if(mode === "clear" && (sky === "night" || sky === "late")){
    meteorCd -= dt;
    if(meteorCd <= 0){ spawnMeteor(); meteorCd = Math.random()*9 + 4; }
  }
  for(i = effects.length - 1; i >= 0; i--){
    var e2 = effects[i];
    if(e2.t === "meteor"){
      e2.x += e2.vx * dt; e2.y += e2.vy * dt; e2.life -= .02 * dt;
      if(e2.life <= 0 || e2.x < -80 || e2.x > W + 80){ effects.splice(i, 1); continue; }
      var grad = x.createLinearGradient(e2.x, e2.y, e2.x - e2.vx*12, e2.y - e2.vy*12);
      grad.addColorStop(0, "rgba(255,255,255," + (e2.life) + ")");
      grad.addColorStop(1, "rgba(160,190,255,0)");
      x.globalAlpha = 1;
      x.strokeStyle = grad; x.lineWidth = 1.8; x.lineCap = "round";
      x.beginPath(); x.moveTo(e2.x, e2.y); x.lineTo(e2.x - e2.vx*12, e2.y - e2.vy*12); x.stroke();
    } else if(e2.t === "splash"){
      e2.r += 1.4 * dt; e2.a *= Math.pow(.94, dt);
      if(e2.a < .02){ effects.splice(i, 1); continue; }
      x.globalAlpha = 1;
      x.beginPath(); x.ellipse(e2.x, e2.y, e2.r, e2.r*.3, 0, 0, 6.2832);
      x.strokeStyle = "rgba(185,215,255," + e2.a + ")"; x.lineWidth = 1; x.stroke();
    }
  }

  if(SCN.plant) drawPlant(now);
  if(SCN.fire) drawCampfire(now);
  x.globalAlpha = 1;
  raf = requestAnimationFrame(frame);
}

/* 切回标签页：停帧 → 暖场一帧 → 恢复，杜绝卡顿 */
document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    if(raf){ cancelAnimationFrame(raf); raf = null; }
  } else if(!reduced && !raf){
    lastT = 0;
    frame(0);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }
});

addEventListener("resize", rs);
rs();
if(reduced){ frame(0); cancelAnimationFrame(raf); raf = null; }
else { raf = requestAnimationFrame(frame); }
})();
</script>
</body>
