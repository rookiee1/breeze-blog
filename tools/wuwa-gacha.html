<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸣潮抽卡分析 · Breeze Tools</title>
<style>
:root{
  --bg:#0a0f1e; --surface:#121a2e; --surface2:#182238;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --text:#e8ecf6; --text2:#9aa5bd; --text3:#5d6b85;
  --a1:#6ee7d8; --a2:#7aa2ff; --a3:#c9a7ff;
  --grad:linear-gradient(135deg,#6ee7d8,#7aa2ff 55%,#c9a7ff);
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(700px 500px at 20% 15%,color-mix(in srgb,var(--a2) 9%,transparent),transparent),
             radial-gradient(800px 600px at 80% 85%,color-mix(in srgb,var(--a3) 8%,transparent),transparent)}
canvas#wind{position:fixed;inset:0;pointer-events:none}
.wrap{max-width:820px;margin:0 auto;padding:12vh 24px 80px;position:relative;text-align:center}
.back{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text3);text-decoration:none;padding:9px 20px;border:1px solid var(--line2);border-radius:100px;transition:.3s}
.back:hover{color:var(--a1);border-color:var(--a1)}
.big-ico{font-size:64px;margin:40px 0 8px;display:inline-block;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
h1{font-size:clamp(30px,5vw,46px);font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--text2);font-size:15px;margin:14px 0 8px}
.build{display:inline-flex;align-items:center;gap:10px;margin:18px 0 34px;padding:10px 26px;border-radius:100px;
  border:1px solid var(--line2);background:var(--surface);font-size:13.5px;color:var(--text2)}
.build .dot{width:9px;height:9px;border-radius:50%;background:var(--a1);box-shadow:0 0 12px var(--a1);animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;text-align:left;margin-bottom:44px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;transition:.3s var(--ease)}
.feat:hover{transform:translateY(-4px);border-color:var(--line2)}
.feat .fi{font-size:24px;margin-bottom:10px}
.feat b{display:block;font-size:14.5px;margin-bottom:6px}
.feat span{font-size:12.5px;color:var(--text3);line-height:1.8}
.foot{font-size:12.5px;color:var(--text3)}
.foot b{color:var(--text2)}
</style>
</head>
<body>
<canvas id="wind"></canvas>
<div class="wrap">
  <a class="back" href="/">← 回到 Breeze</a>
  <div class="big-ico">🎯</div>
  <h1>鸣潮抽卡分析</h1>
  <p class="sub">千星奇域 · 抽卡记录数据可视化工具</p>
  <div class="build"><span class="dot"></span>施工中 —— 风正在把最后一个图表吹进页面</div>
  <div class="feats">
    <div class="feat"><div class="fi">🔗</div><b>链接导入</b><span>粘贴游戏内复制的抽卡记录链接，自动分页拉取全部记录，无需手动导出文件。</span></div>
    <div class="feat"><div class="fi">🎲</div><b>出货统计</b><span>各卡池五星数量、平均抽数、歪与不歪比例，一眼看清你的运气成色。</span></div>
    <div class="feat"><div class="fi">📈</div><b>趋势图表</b><span>历史出金曲线、保底倒计时预警、欧非指数雷达图，全用 Canvas 手绘。</span></div>
    <div class="feat"><div class="fi">🔒</div><b>隐私优先</b><span>所有计算在浏览器本地完成，抽卡记录不会被上传或存储到任何服务器。</span></div>
  </div>
  <p class="foot">由 <b>Breeze</b> 手工打造 · 属于 <b>Breeze Tools</b> 工具箱系列 · 敬请期待 🍃</p>
</div>
<script>
(function(){
"use strict";
var c = document.getElementById("wind"), x = c.getContext("2d");
var W, H, P = [];
var COLORS = ["110,231,216","122,162,255","201,167,255"];
function rs(){
  W = c.width = innerWidth; H = c.height = innerHeight;
  P = [];
  var n = Math.min(90, W * H / 20000);
  for(var i = 0; i < n; i++) P.push({
    x: Math.random()*W, y: Math.random()*H, vx: Math.random()*.5+.15,
    l: Math.random()*16+6, c: COLORS[Math.floor(Math.random()*3)], a: Math.random()*.3+.08
  });
}
function f(t){
  x.clearRect(0,0,W,H);
  for(var i = 0; i < P.length; i++){
    var p = P[i];
    p.x += p.vx * (1.6 + Math.sin(t*.0009 + p.y*.01)*.8);
    if(p.x > W + 30) p.x = -30;
    x.beginPath();
    x.moveTo(p.x - p.l, p.y);
    x.lineTo(p.x, p.y);
    x.strokeStyle = "rgba(" + p.c + "," + p.a + ")";
    x.lineWidth = 1.1; x.lineCap = "round"; x.stroke();
  }
  requestAnimationFrame(f);
}
rs(); addEventListener("resize", rs); requestAnimationFrame(f);
})();
</script>
</body>
</html>
